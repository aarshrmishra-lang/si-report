async function loadBitmap(file) {

}

async function processImage(file, maxSide = 2000) {

}

// Landscape framing: where the 4:3 window sits along the overflowing side (0 = left/top, 1 = right/bottom)
const needsFrame = (p) => Math.abs(p.w / p.h - RATIO) > 0.02;
const framePos = (p) => { const k = p.pos ?? 0.5; return p.w / p.h > RATIO ? `${k * 100}% 50%` : `50% ${k * 100}%`; };
async function cropLandscape(blob, p, maxW = 1600) {
  const src = await loadBitmap(blob), w = p.w, hh = p.h, k = p.pos ?? 0.5;
  let sx = 0, sy = 0, sw = w, sh = hh;
  if (w / hh > RATIO) { sw = hh * RATIO; sx = (w - sw) * k; } else { sh = w / RATIO; sy = (hh - sh) * k; }

}

    }

  }

})();

async function loadJsQR() {

async function startScanner(video, onCode) {
  const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } }, audio: false });
  video.srcObject = stream; video.setAttribute('playsinline', ''); await video.play();

  if ('BarcodeDetector' in window) { try { const f = await BarcodeDetector.getSupportedFormats(); if (f.includes('qr_code')) detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { } }
  if (!detector) decode = await loadJsQR();

      }
    } catch (e) { }
    setTimeout(tick, 180);
  };
  const stop = () => { stopped = true; stream.getTracks().forEach(t => t.stop()); video.srcObject = null; };
  tick(); return stop;
}

function slotView(sec, def, i, p, pick) {

  resetTools(); fig.append(tools);

async function addToSlots(sec, files, startSlot, desc) {
  const list = [...files].filter(f => f.type.startsWith('image/') || /\.(jpe?g|png|heic|webp)$/i.test(f.name));
  if (!list.length) return;
  const n = Model.layout(current, sec), slots = Model.slots(current, sec);
  const order = [];
  if (startSlot != null) order.push(startSlot);
  for (let i = 0; i < n; i++) if (!slots[i] && !order.includes(i)) order.push(i);
  const take = list.slice(0, order.length);
  if (list.length > take.length) toast(`${list.length - take.length} photo(s) not added: all ${n} boxes are full.`);
  setSaved(`Processing ${take.length} photo${take.length > 1 ? 's' : ''}…`);
  let firstId = null;
  for (let k = 0; k < take.length; k++) {
    const slot = order[k];
    try {
      const { blob, w, h: hh } = await processImage(take[k]);
      const id = uid(); await Store.putBlob(id, blob);
      const old = slots[slot]; let d = k === 0 ? desc : '';
      if (old) { current.photos[old.id].del = true; current.photos[old.id].t = now(); if (!d) d = old.desc || ''; }
      current.photos[id] = { sec, slot, desc: d || '', order: slot + 1, w, h: hh, pos: 0.5, t: now() };
      if (!firstId) firstId = id;
    } catch (e) { toast('Could not read ' + take[k].name + '. Try a JPEG or PNG.'); }
  }
  await Store.putReport(current); setSaved('Saved on this device');
  renderPhotoArea(sec); updateStatus(sec);
  const d = firstId && document.getElementById('d-' + firstId);
  if (d && !d.value) d.focus({ preventScroll: false });
}

async function rotatePhoto(sec, id) {

  current.photos[nid] = { ...p, w: out.w, h: out.h, pos: 0.5, t: now() };

}

function signSheet() {
  const r = current;
  const el = h('section', { class: 'sheet', id: 'sec-sign' }, h('div', { class: 'sheet-head' }, h('h2', {}, 'Sign-off'), h('span', { class: 'chip', id: 'chip-sign' })));

  el.append(g);
  const canvas = h('canvas', { class: 'sig', width: 840, height: 300, 'aria-label': 'Signature pad' });
  const ctx = canvas.getContext('2d'); let drawing = false, dirty = false, last = null;
  const pos = (e) => { const b = canvas.getBoundingClientRect(); return [(e.clientX - b.left) * canvas.width / b.width, (e.clientY - b.top) * canvas.height / b.height]; };
  canvas.addEventListener('pointerdown', (e) => { drawing = true; last = pos(e); canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', (e) => { if (!drawing) return; const p = pos(e); ctx.strokeStyle = '#0b1f3a'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(...last); ctx.lineTo(...p); ctx.stroke(); last = p; dirty = true; });
  const end = async () => { if (!drawing) return; drawing = false; if (!dirty) return; dirty = false;
    const blob = await new Promise(res => { const c2 = document.createElement('canvas'); c2.width = canvas.width; c2.height = canvas.height; const x = c2.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c2.width, c2.height); x.drawImage(canvas, 0, 0); c2.toBlob(res, 'image/jpeg', 0.9); });
    const id = uid(); await Store.putBlob(id, blob); Model.set(current, 'sig', id); Model.set(current, 'sigSize', { w: canvas.width, h: canvas.height }); if (!Model.get(current, 'signDate')) { Model.set(current, 'signDate', todayISO()); sd.value = todayISO(); } flushNow(); updateStatus('sign'); };
  canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);
  const sid = Model.get(r, 'sig', null);
  if (sid) blobURL(sid).then(u => { if (!u) return; const im = new Image(); im.onload = () => ctx.drawImage(im, 0, 0, canvas.width, canvas.height); im.src = u; });
  el.append(h('div', { class: 'f' }, h('span', { class: 'f', style: 'display:block' }, 'Signature (draw with finger, pen or mouse)'), canvas,
    h('div', { class: 'row' }, h('button', { class: 'btn small', type: 'button', onclick: () => { ctx.clearRect(0, 0, canvas.width, canvas.height); Model.set(current, 'sig', null); flushNow(); updateStatus('sign'); } }, 'Clear signature'))));
  el.append(h('p', { class: 'note' }, 'Form reminders: findings go on OMP-17-01E to the Master; enclose the SMP-09-04A crew evaluation of Master and CE; submit within 7 working days of disembarkation.'));
  const delWrap = h('div', { class: 'row' });
  const askDel = () => delWrap.replaceChildren(h('span', { class: 'confirm' }, 'Delete this report from all synced devices?', h('button', { class: 'btn small danger', onclick: async () => { Model.set(current, 'deleted', true); await Store.putReport(current); toast('Report deleted'); renderHome(); } }, 'Delete report'), h('button', { class: 'btn small', onclick: resetDel }, 'Cancel')));
  const resetDel = () => delWrap.replaceChildren(h('button', { class: 'btn small ghost danger', onclick: askDel }, icon('trash'), 'Delete report'));

    try {
      const blob = await buildDocx(r), name = docxName(r);
      status.textContent = `Ready: ${name} (${(blob.size / 1048576).toFixed(1)} MB)`;
      if (mode === 'share') await shareFile(blob, name, 'SI Vessel Attendance Report'); else await saveFile(blob, name);
    } catch (e) { status.textContent = 'Could not build the report: ' + e.message; }
    btns.querySelectorAll('button').forEach(b => b.disabled = false);
  };
  btns.append(h('button', { class: 'btn primary', onclick: () => go('save') }, icon('dl'), 'Download .docx'));
  if (canShareFiles()) btns.append(h('button', { class: 'btn', onclick: () => go('share') }, icon('share'), 'Share (email, WhatsApp…)'));
}

/* ---- Preview ---- */

  const r = current, paper = h('div', { class: 'paper' });

  paper.append(h('div', { class: 'hdr' }, h('div', {}, '◯◯'), h('div', {}, h('b', {}, 'Office Management Procedures'), h('b', {}, 'OMP'), '17-00 Monitoring & Measurement', h('b', {}, 'App: 17-01H SI VESSEL ATTENDANCE REPORT')), h('div', {}, h('b', {}, 'Doc No.: OMP-17-01H'), 'Revision: 01 · 15 Apr 2022')));
  paper.append(h('div', { style: 'text-align:right;margin-top:10px' }, 'Date: ', h('u', {}, fmtDate(Model.get(r, 'date')) || ' '.repeat(20))));
  const at = h('table', { class: 'pt appr' });

  paper.append(at, h('div', { class: 'ttl' }, 'COMPANY', h('br'), 'VESSEL', h('br'), 'ATTENDANCE REPORT'));
  const cover = Model.visible(r, 'cover')[0]; if (cover) paper.append(h('div', { class: 'cover' }, thumb(cover)));
  paper.append(h('div', { style: 'font-size:18px' }, h('u', {}, 'MT/MV: ' + (Model.get(r, 'vessel') || ''))));
  const pt = h('table', { class: 'pt' });
  [['Voyage Number', Model.get(r, 'voyage')], ['Port & Berth', Model.get(r, 'port')], ['Date of Visit', visitText(r)], ['Inspector Name', Model.get(r, 'inspector')], ['Date of Last Visit', fmtDate(Model.get(r, 'lastVisit'))]].forEach(([l, v]) => pt.append(h('tr', {}, h('td', {}, l), h('td', {}, v))));
  paper.append(pt, h('div', { style: 'text-align:center;font-size:16px;margin-top:14px' }, h('u', {}, 'Summary of Conditions')));
  const nil = Model.get(r, 'nil', true) !== false;
  for (const s of SECTIONS) {
    const ind = s.sub ? 'margin-left:20px' : '';
    paper.append(h('h4', { style: s.sub ? 'margin-left:20px;font-size:13px' : '' }, s.sub ? `${s.num.slice(-1)}) ${s.title}` : `${s.num}. ${s.title}`));
    const c = Model.get(r, 'c:' + s.id).trim(), c2 = Model.get(r, 'c2:' + s.id).trim(), ph = Model.visible(r, s.id);
    if (c) paper.append(h('div', { class: 'com', style: ind }, c));
    else if (!ph.length && !c2 && nil && !s.noNil) paper.append(h('div', { class: 'nil', style: ind }, 'NIL'));
    if (ph.length) { const g = h('div', { class: 'pg' }); ph.forEach(p => g.append(h('figure', {}, thumb(p), h('figcaption', {}, p.desc || '')))); paper.append(g); }
    if (c2) paper.append(h('div', { class: 'com', style: ind }, c2));
  }
  const sigImg = h('img', { alt: 'Signature', style: 'height:44px;vertical-align:middle' }); const sid = Model.get(r, 'sig', null); if (sid) blobURL(sid).then(u => sigImg.src = u);
  paper.append(h('div', { style: 'margin-top:20px;text-align:right' }, 'Signature/Date: ', sid ? sigImg : '', ' ', fmtDate(Model.get(r, 'signDate'))), h('div', { style: 'text-align:right' }, 'Prepared by: ', Model.get(r, 'preparedBy')));
  modal(h('div', { class: 'dialog wide' }, dialogHead('Preview'), h('p', { class: 'note', style: 'margin:0' }, 'Approximate layout. The Word file uses the original form with its header, logo and remarks.'), paper));

/* ---- Import ---- */
async function importFile(file) {
  if (!file) return;
  try {
    const res = await applyBundle(JSON.parse(await file.text()));
    toast(`Imported: ${res.added} new, ${res.changed} updated report(s), ${res.photos} photo(s)`);
    current ? openReport(current.id) : renderHome();
  } catch (e) { toast(e.message || 'Could not read that file.'); }
}

/* ---- Sync dialog ---- */
function openSync() {
  flushSave();
  let tab = P2P.available() ? 'wifi' : 'file';
  const body = h('div', { style: 'display:grid;gap:14px' });
  const tabs = h('div', { class: 'tabs', role: 'tablist' });
  const mk = (id, label) => h('button', { role: 'tab', 'aria-selected': String(tab === id), onclick: () => { tab = id; [...tabs.children].forEach(b => b.setAttribute('aria-selected', String(b.dataset.id === tab))); cleanupSession(); draw(); }, 'data-id': id }, label);
  tabs.append(mk('wifi', 'Wi‑Fi (nearby device)'), mk('file', 'Bluetooth / file'));
  let session = null, stopScan = null;
  const cleanupSession = () => { if (stopScan) { stopScan(); stopScan = null; } if (session && !session.finished) session.close(); session = null; };
  const d = h('div', { class: 'dialog' }, dialogHead('Sync between devices'), tabs, body);
  modal(d, cleanupSession);

  function draw() { body.replaceChildren(tab === 'wifi' ? wifiPane() : filePane()); }

  function filePane() {
    const wrap = h('div', { style: 'display:grid;gap:12px' });
    const scope = current ? 'this report' : 'all reports';
    wrap.append(h('ol', { class: 'steps' },
      h('li', {}, h('div', {}, h('b', {}, 'Send: '), `create a sync file of ${scope} with all photos. On a phone, choose `, h('b', {}, 'Bluetooth'), ', Quick Share / Nearby Share or AirDrop in the share sheet. On a computer, save it and send it by Bluetooth, USB or email.')),
      h('li', {}, h('div', {}, h('b', {}, 'Receive: '), 'on the other device open this app and tap ', h('b', {}, 'Import sync file'), '. Newer edits win field by field, so nothing typed on either device is lost.'))));
    const st = h('div', { class: 'muted', style: 'font-size:13px' });
    const make = async (share) => {
      st.textContent = 'Packing…';
      const reports = current ? [current] : (await Store.allReports());
      const bundle = await makeBundle(reports);
      const blob = new Blob([JSON.stringify(bundle)], { type: 'application/json' });
      const name = `OMP17-sync_${current ? safeName(Model.get(current, 'vessel') || 'report') : 'all'}_${todayISO()}.json`;
      st.textContent = `${reports.length} report(s), ${Object.keys(bundle.blobs).length} photo(s), ${(blob.size / 1048576).toFixed(1)} MB`;
      share ? shareFile(blob, name, 'OMP-17-01H sync file') : saveFile(blob, name);
    };
    const fileIn = h('input', { type: 'file', accept: '.json,application/json', hidden: true, onchange: (e) => { closeModal(); importFile(e.target.files[0]); } });
    const row = h('div', { class: 'row' });
    if (canShareFiles()) row.append(h('button', { class: 'btn primary', onclick: () => make(true) }, icon('share'), 'Send via Bluetooth / share'));
    row.append(h('button', { class: canShareFiles() ? 'btn' : 'btn primary', onclick: () => make(false) }, icon('dl'), 'Save sync file'), h('button', { class: 'btn', onclick: () => fileIn.click() }, icon('up'), 'Import sync file'), fileIn);
    wrap.append(row, st);
    return wrap;
  }

  function wifiPane() {
    const wrap = h('div', { style: 'display:grid;gap:12px' });
    if (!P2P.available()) {
      wrap.append(h('div', { class: 'banner' }, h('b', {}, 'Not available in this preview. '), 'Direct Wi‑Fi sync needs the installed app (it uses a peer-to-peer connection the preview frame blocks). Use the Bluetooth / file tab here.'));
      return wrap;
    }
    wrap.append(h('p', { style: 'margin:0' }, 'Both devices must be on the same Wi‑Fi network or one device’s hotspot. No internet is needed. All reports and photos are merged both ways.'));
    const log = h('div', { class: 'log', hidden: true });
    const say = (t) => { log.hidden = false; log.textContent += (log.textContent ? '\n' : '') + t; log.scrollTop = 1e6; };
    const stage = h('div', { style: 'display:grid;gap:12px' });
    const onDone = (st) => { say(`Done: ${st.reports} report(s) updated, ${st.got} photo(s) received, ${st.sent} sent.`); stage.replaceChildren(h('button', { class: 'btn primary', onclick: () => { closeModal(); current ? openReport(current.id) : renderHome(); } }, 'Finish')); };

    const qrBlock = (code, caption) => { const c = document.createElement('canvas'); try { QR.toCanvas(QR.encode(new TextEncoder().encode(code), 'L'), c, 6, 4); } catch (e) { } return h('div', { class: 'qrbox' }, c, h('div', { class: 'muted', style: 'font-size:13px;text-align:center' }, caption),
      h('textarea', { class: 'inp code', readonly: true, value: code, 'aria-label': 'Pairing code text', onfocus: (e) => e.target.select() }),
      h('button', { class: 'btn small', onclick: async (e) => { try { await navigator.clipboard.writeText(code); e.target.textContent = 'Copied'; } catch (err) { e.target.closest('.qrbox').querySelector('textarea').select(); } } }, 'Copy code')); };
    const scanBlock = (label, onCode) => {
      const video = h('video', { class: 'scan', muted: true, playsinline: true, hidden: true });
      const paste = h('textarea', { class: 'inp code', placeholder: 'Or paste the code here', 'aria-label': label });
      const err = h('div', { class: 'muted', style: 'font-size:13px' });
      const go = (code) => { if (stopScan) { stopScan(); stopScan = null; } video.hidden = true; onCode(code); };
      return h('div', { style: 'display:grid;gap:8px' }, h('div', { class: 'row' },
        h('button', { class: 'btn primary', onclick: async () => { err.textContent = ''; try { video.hidden = false; stopScan = await startScanner(video, go); } catch (e) { video.hidden = true; err.textContent = 'Camera unavailable (' + (e.message || e.name) + '). Paste the code instead.'; } } }, icon('cam'), 'Scan with camera'),
        h('button', { class: 'btn', onclick: () => paste.value.trim() && go(paste.value.trim()) }, 'Use pasted code')), video, paste, err);
    };
    const noAddr = 'No local network address was found. Check that Wi‑Fi is on. On iPhone/iPad, allow camera access once (tap Scan), then start again.';

    const host = async () => {
      cleanupSession(); session = new P2P.Session(say, onDone); log.textContent = ''; say('Preparing pairing code…');
      try {
        const { code, ok } = await session.host(); if (!ok) say(noAddr);
        stage.replaceChildren(h('ol', { class: 'steps' }, h('li', {}, 'On the other device open Sync → Wi‑Fi → “Join”, and scan this code.'), h('li', {}, 'Then scan the reply code it shows.')),
          qrBlock(code, 'Pairing code'), scanBlock('Reply code', async (c) => { try { await session.accept(c); say('Reply accepted. Connecting…'); } catch (e) { say(e.message); } }));
      } catch (e) { say('Error: ' + e.message); }
    };
    const join = () => {
      cleanupSession(); session = new P2P.Session(say, onDone); log.textContent = '';
      stage.replaceChildren(h('ol', { class: 'steps' }, h('li', {}, 'Scan the pairing code shown on the first device.')),
        scanBlock('Pairing code', async (c) => { try { say('Code read. Creating reply…'); const { code, ok } = await session.join(c); if (!ok) say(noAddr); stage.replaceChildren(h('ol', { class: 'steps' }, h('li', {}, 'Let the first device scan this reply code. The sync starts automatically.')), qrBlock(code, 'Reply code')); } catch (e) { say(e.message); } }));
    };
    wrap.append(h('div', { class: 'row' }, h('button', { class: 'btn primary', onclick: host }, icon('qr'), 'Start (show code)'), h('button', { class: 'btn', onclick: join }, icon('cam'), 'Join (scan code)')), stage, log);
    return wrap;
  }
  draw();
}

/* ---------------- Example report ---------------- */
async function exampleImage(label, hue, seed) {
  const c = document.createElement('canvas'); c.width = 1200; c.height = 900; const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 900); g.addColorStop(0, `hsl(${hue},45%,72%)`); g.addColorStop(.55, `hsl(${hue},35%,52%)`); g.addColorStop(.56, `hsl(${hue + 10},30%,30%)`); g.addColorStop(1, `hsl(${hue + 10},35%,18%)`);
  x.fillStyle = g; x.fillRect(0, 0, 1200, 900);
  x.fillStyle = 'rgba(20,30,40,.85)'; x.beginPath(); x.moveTo(120, 560); x.lineTo(1080, 560); x.lineTo(1000, 680); x.lineTo(200, 680); x.closePath(); x.fill();
  x.fillStyle = '#e8e2d6'; x.fillRect(760 - seed * 40, 420, 180, 140); x.fillStyle = '#c0392b'; x.fillRect(800 - seed * 40, 340, 50, 80);
  x.fillStyle = 'rgba(0,0,0,.55)'; x.fillRect(0, 800, 1200, 100); x.fillStyle = '#fff'; x.font = '600 44px sans-serif'; x.fillText('EXAMPLE PHOTO · ' + label.toUpperCase(), 40, 866);
  return new Promise(r => c.toBlob(b => r(b), 'image/jpeg', .8));
}
async function seedExample() {
  const from = new Date(Date.now() - 4 * 864e5), iso = (d) => new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  const r = Model.create({ example: true, vessel: 'MT Ocean Pearl (example)', date: todayISO(), voyage: '112W', port: 'Singapore – Jurong Island, Berth J4', visitDate: iso(from), visitTo: todayISO(), inspector: 'Example Inspector', lastVisit: '2026-06-12', preparedBy: 'Example Inspector', apprPIC: 'Example Inspector', nil: true,
    'c:s1': 'Hull and superstructure paintwork in fair condition. Light rust streaks noted at forward port shell plating near the anchor pocket.',
    'c2:s1': 'Draft marks and load line clearly visible. No new dents observed.',
    'c:s4': 'Deck machinery operational. Mooring winch No.2 brake lining due for renewal per PMS.',
    'L:s4': 4,
    'c:s7': 'Engine room clean and well lit. Minor oil weeping at GE No.3 fuel pump; Chief Engineer to rectify before departure.',
    'c:s11a': 'Fleet alert on enclosed space entry discussed with all officers.',
    'c:s16': 'Vessel generally well maintained. No major deficiencies. Two observations raised on OMP-17-01E and handed to Master.' });
  const add = async (sec, slot, label, hue, desc = label) => { const b = await exampleImage(label, hue, slot); const id = uid(); await Store.putBlob(id, b); r.photos[id] = { sec, slot, desc, order: slot + 1, w: 1200, h: 900, pos: 0.5, t: now() }; };
  await add('cover', 0, 'Vessel at berth', 210, '');
  await add('s1', 0, 'Side view – forward', 205, 'Draft marks and load line clearly visible'); await add('s1', 1, 'Bird’s eye – forecastle', 200, 'Forecastle deck in good order');
  await add('s4', 0, 'Mooring winch', 30, 'Mooring winch No.2 – brake lining worn'); await add('s4', 1, 'Windlass', 25, 'Windlass tried out, working satisfactorily'); await add('s4', 2, 'Cargo deck', 40, 'Cross decks under maintenance');
  await add('s7', 0, 'Main engine', 15, 'Main engine leak free'); await add('s7', 1, 'Generator engine', 10, 'GE No.3 – minor oil weeping at fuel pump');
  await Store.putReport(r); return r;
}

/* ---------------- Boot ---------------- */
async function boot() {
  if (IS_ARTIFACT) {
    const all = await Store.allReports();
    if (!all.length && !lsGet('seeded', false)) { await seedExample(); lsSet('seeded', true); }
  }
  const last = lsGet('last', null);
  if (last && await Store.getReport(last)) openReport(last); else renderHome();
  if (!IS_ARTIFACT && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
  if (!IS_ARTIFACT && navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { });
  window.addEventListener('pagehide', () => flushSave());
  document.addEventListener('visibilitychange', () => { if (document.hidden) flushSave(); });
}
boot();
window.__omp = { Store, Model, buildDocx, makeBundle, applyBundle, P2P, seedExample };
})();
